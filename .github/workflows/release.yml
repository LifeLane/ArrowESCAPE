name: Arrow Escape Release Pipeline

on:
  push:
    branches: [ main, master, develop, 'release/**', 'feature/**', 'hotfix/**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Release Artifacts (AAB & APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew || true

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Verify Package Identity
        run: |
          echo "Verifying Package Identity..."
          APP_ID=$(grep -E 'applicationId\s*=\s*"com.mitsara.arrowescape"' app/build.gradle.kts || true)
          NAMESPACE=$(grep -E 'namespace\s*=\s*"com.mitsara.arrowescape"' app/build.gradle.kts || true)
          if [ -z "$APP_ID" ] || [ -z "$NAMESPACE" ]; then
            echo "::error:: Package identity mismatch! Expected com.mitsara.arrowescape"
            exit 1
          fi
          echo "✔ Package identity verified: com.mitsara.arrowescape"

      - name: Setup Keystore & Signing Configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p "${{ runner.temp }}"
          KEYSTORE_FILE="${{ runner.temp }}/arrowescape-release.jks"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            
            PASS="${KEYSTORE_PASSWORD:-android}"
            ALIAS="${KEY_ALIAS:-arrowescape}"
            KEY_PASS="${KEY_PASSWORD:-$PASS}"

            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "RELEASE_KEYSTORE_PASSWORD=$PASS" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "✔ Production Keystore configured."
          else
            echo "::warning:: KEYSTORE_BASE64 secret not found, generating release signing key for automated build..."
            keytool -genkey -v -keystore "$KEYSTORE_FILE" -alias "arrowescape" -keyalg RSA -keysize 2048 -validity 10000 -storepass "android" -keypass "android" -dname "CN=ArrowEscape, OU=Release, O=Mitsara, L=City, S=State, C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=arrowescape" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "RELEASE_KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=arrowescape" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "✔ Automated build keystore initialized."
          fi

      - name: Run Clean
        run: ./gradlew clean

      - name: Build Release Bundle (AAB)
        run: ./gradlew bundleRelease --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Release Outputs
        run: |
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "::error:: AAB release build output missing!"
            exit 1
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error:: APK release build output missing!"
            exit 1
          fi

          AAB_SIZE=$(stat -c%s "$AAB_FILE" 2>/dev/null || stat -f%z "$AAB_FILE")
          APK_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")

          echo "✔ Verified Release AAB ($AAB_SIZE bytes) at $AAB_FILE"
          echo "✔ Verified Release APK ($APK_SIZE bytes) at $APK_FILE"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrowescape-playstore-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrowescape-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: Clean Temporary Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/arrowescape-release.jks"

