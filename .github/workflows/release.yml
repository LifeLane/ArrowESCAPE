name: Arrow Escape Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build Signed Release Artifacts (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Run Gradle Version Check
        run: ./gradlew --version

      - name: Verify Package Identity
        run: |
          APP_ID=$(grep -E 'applicationId\s*=\s*"com.mitsara.arrowescape"' app/build.gradle.kts || true)
          NAMESPACE=$(grep -E 'namespace\s*=\s*"com.mitsara.arrowescape"' app/build.gradle.kts || true)
          if [ -z "$APP_ID" ] || [ -z "$NAMESPACE" ]; then
            echo "ERROR: Package identity mismatch! Expected com.mitsara.arrowescape"
            exit 1
          fi

      - name: Run Clean
        run: ./gradlew clean

      - name: Run Lint
        run: ./gradlew lint --stacktrace

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Prepare Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error:: KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi
          mkdir -p ${{ runner.temp }}/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ runner.temp }}/keystore/release.keystore
          if [ ! -s "${{ runner.temp }}/keystore/release.keystore" ]; then
            echo "::error:: Failed to decode KEYSTORE_BASE64"
            exit 1
          fi

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arrow-escape-release-build
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
