name: Arrow Escape Android CI Pipeline

on:
  push:
    branches: [ main, master, develop, 'release/**', 'feature/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  verify-and-test:
    name: Build Verification, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Verify Package Identity
        run: |
          echo "Verifying Package Identity..."
          APP_ID=$(grep -E 'applicationId\s*=\s*"com.mitsara.arrowescape"' app/build.gradle.kts || true)
          NAMESPACE=$(grep -E 'namespace\s*=\s*"com.mitsara.arrowescape"' app/build.gradle.kts || true)
          
          if [ -z "$APP_ID" ] || [ -z "$NAMESPACE" ]; then
            echo "ERROR: Package identity mismatch! Expected com.mitsara.arrowescape"
            exit 1
          fi
          echo "Package identity verified: com.mitsara.arrowescape"

      - name: Run Gradle Version Check
        run: ./gradlew --version

      - name: Run Clean
        run: ./gradlew clean

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arrow-escape-debug-apk
          path: app/build/outputs/apk/debug/*.apk
