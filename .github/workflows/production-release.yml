name: Arrow Escape Production Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version Code (e.g. 100)'
        required: true
        default: '100'
      play_track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'

jobs:
  production-release-gate:
    name: Release Gate & Signed AAB Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: 1. Verify Package Identity Gate
        run: |
          echo "=== GATE 1: Package Identity Check ==="
          APP_ID=$(grep -E 'applicationId\s*=\s*"com.mitsara.arrowescape"' app/build.gradle.kts || true)
          NAMESPACE=$(grep -E 'namespace\s*=\s*"com.mitsara.arrowescape"' app/build.gradle.kts || true)
          MANIFEST_PKG=$(grep -E 'package="com.mitsara.arrowescape"' app/src/main/AndroidManifest.xml || true)
          
          if [ -z "$APP_ID" ] || [ -z "$NAMESPACE" ]; then
            echo "::error:: Package identity gate failed! Expected applicationId and namespace: com.mitsara.arrowescape"
            exit 1
          fi
          echo "✔ Package Identity Verified: com.mitsara.arrowescape"

      - name: 2. Run Lint Code Quality Gate
        run: |
          echo "=== GATE 2: Android Lint Check ==="
          ./gradlew lintDebug --stacktrace || gradle lintDebug

      - name: 3. Run Unit Tests Gate
        run: |
          echo "=== GATE 3: Unit Tests Check ==="
          ./gradlew testDebugUnitTest --stacktrace || gradle testDebugUnitTest

      - name: 4. Verify Signing Configuration & Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "=== GATE 4: Signing Secrets Gate ==="
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error:: RELEASE_KEYSTORE_BASE64 secret is missing! Keystore required for production signed release."
            exit 1
          fi
          
          mkdir -p ${{ runner.temp }}/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ runner.temp }}/keystore/release.keystore
          
          if [ ! -s "${{ runner.temp }}/keystore/release.keystore" ]; then
            echo "::error:: Failed to decode RELEASE_KEYSTORE_BASE64 into keystore file!"
            exit 1
          fi
          echo "✔ Keystore decoded successfully to runner path."

      - name: 5. Build Signed Release AAB & APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: |
          echo "=== GATE 5: Building Signed AAB & APK ==="
          ./gradlew bundleRelease assembleRelease --stacktrace || gradle bundleRelease assembleRelease

      - name: 6. Verify Signed AAB Artifact Gate
        run: |
          echo "=== GATE 6: Signed AAB Artifact Verification ==="
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error:: AAB Generation failed! File not found at $AAB_PATH"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$AAB_PATH" 2>/dev/null || stat -f%z "$AAB_PATH")
          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "::error:: Generated AAB size ($FILE_SIZE bytes) is suspiciously small!"
            exit 1
          fi
          
          echo "✔ Signed AAB generated successfully ($FILE_SIZE bytes)."

      - name: 7. Upload Release Artifacts (AAB & APK)
        uses: actions/upload-artifact@v4
        with:
          name: arrow-escape-signed-release-v${{ inputs.version_name || '1.0.0' }}-b${{ inputs.version_code || github.run_number }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk

      - name: 8. Deploy to Google Play Console
        if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: rstudio/actions-google-play-publish@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mitsara.arrowescape
          aabFile: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track || 'internal' }}
          whatsNewDirectory: distribution/release-notes
