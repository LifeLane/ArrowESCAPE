name: Arrow Escape Production Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

      version_code:
        description: 'Version Code (e.g. 100)'
        required: true
        default: '100'

jobs:
  production-release:
    name: Build Signed AAB & Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verify Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew was not found in the repository root."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Verify Package Identity
        run: |
          echo "Checking application identity..."

          if ! grep -q 'applicationId.*com.mitsara.arrowescape' app/build.gradle.kts; then
            echo "::error::Incorrect or missing applicationId."
            exit 1
          fi

          if ! grep -q 'namespace.*com.mitsara.arrowescape' app/build.gradle.kts; then
            echo "::error::Incorrect or missing namespace."
            exit 1
          fi

          echo "Package identity verified:"
          echo "com.mitsara.arrowescape"

      - name: Run Lint
        run: |
          ./gradlew lint --stacktrace

      - name: Run Unit Tests
        run: |
          ./gradlew test --stacktrace

      - name: Verify Signing Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 GitHub Secret is missing."
            exit 1
          fi

          echo "Signing secret detected."

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/arrowescape"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arrowescape/arrowescape-release.jks"

          if [ ! -s "$RUNNER_TEMP/arrowescape/arrowescape-release.jks" ]; then
            echo "::error::Failed to decode release keystore."
            exit 1
          fi

          echo "Release keystore decoded successfully."

      - name: Verify Keystore Alias
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/arrowescape/arrowescape-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEY_ALIAS is missing."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Release keystore and alias verified."

      - name: Build Signed Release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/arrowescape/arrowescape-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/arrowescape/arrowescape-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Verify AAB
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "::error::Release AAB was not generated."
            exit 1
          fi

          SIZE=$(stat -c%s "$AAB")

          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::AAB appears invalid or suspiciously small."
            exit 1
          fi

          echo "Release AAB verified: $SIZE bytes."

      - name: Verify Release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::Release APK appears invalid or suspiciously small."
            exit 1
          fi

          echo "Release APK verified: $SIZE bytes."

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: arrowescape-playstore-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: arrowescape-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Cleanup Signing Key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/arrowescape/arrowescape-release.jks"

      - name: Release Summary
        if: success()
        run: |
          echo "=========================================="
          echo "ARROW ESCAPE RELEASE BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Application ID:"
          echo "com.mitsara.arrowescape"
          echo ""
          echo "Play Store AAB:"
          echo "app-release.aab"
          echo ""
          echo "Release APK:"
          echo "app-release.apk"
          echo ""
          echo "Both artifacts are available in GitHub Actions."
          echo "=========================================="
