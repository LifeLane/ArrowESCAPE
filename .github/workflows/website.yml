name: Arrow Escape Website Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
  workflow_dispatch:

jobs:
  website-validation:
    name: Validate and Deploy Website Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate HTML Structure
        run: |
          echo "Validating HTML & CSS files in /website directory..."
          test -f website/index.html
          test -f website/how-to-play.html
          test -f website/features.html
          test -f website/game-modes.html
          test -f website/premium.html
          test -f website/support.html
          test -f website/contact.html
          test -f website/privacy.html
          test -f website/terms.html
          test -f website/sitemap.xml
          test -f website/robots.txt
          echo "✔ All website static files present and validated."

      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrow-escape-website-dist
          path: website/
