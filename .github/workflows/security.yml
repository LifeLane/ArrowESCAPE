name: Arrow Escape Security & Dependency Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security & Secret Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Verify Gitignore & Secret Protection
        run: |
          echo "Checking gitignore for secret extensions..."
          for ext in ".keystore" ".jks" ".p12" ".pem" ".base64" "local.properties"; do
            if grep -q "$ext" .gitignore; then
              echo "✔ $ext correctly present in .gitignore"
            else
              echo "⚠️ Warning: $ext missing from .gitignore"
            fi
          done

      - name: Audit Hardcoded Secrets in Source Code
        run: |
          echo "Scanning for accidental hardcoded secret patterns..."
          SUSPECT=$(grep -rEi 'BEGIN (RSA|PRIVATE|CERTIFICATE) KEY' app/src/ || true)
          if [ -n "$SUSPECT" ]; then
            echo "::error:: Potential private key detected in source tree!"
            exit 1
          fi
          echo "✔ Source tree scan clean."

      - name: Dependency Verification Check
        run: ./gradlew dependencies --stacktrace
